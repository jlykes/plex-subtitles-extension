<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Plex MVP - Video Player</title>
    <link rel="manifest" href="/manifest.json">
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
        }
        
        /* Try to hide browser UI elements */
        body.fullscreen {
            padding: 0;
        }
        
        /* Additional attempts to hide browser UI */
        body.fullscreen::-webkit-scrollbar {
            display: none;
        }
        
        body.fullscreen {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        /* PWA-specific styles to hide browser UI */
        @media (display-mode: fullscreen) {
            body {
                padding: 0;
                margin: 0;
            }
        }
        
        /* Additional TV-specific hiding */
        body.fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
        
        .video-container {
            position: relative;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        video {
            width: 100%;
            height: auto;
            border-radius: 8px;
        }
        
        /* Custom fullscreen container */
        .video-container.fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 9999;
            max-width: none;
            margin: 0;
        }
        
        /* Hide browser UI elements in fullscreen */
        .video-container.fullscreen ~ * {
            display: none !important;
        }
        
        /* Additional fullscreen styles to hide browser elements */
        body.fullscreen {
            overflow: hidden;
            margin: 0;
            padding: 0;
        }
        
        body.fullscreen > *:not(.video-container) {
            display: none !important;
        }
        
        .video-container.fullscreen video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 0;
        }
        
        .text-overlay {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 25px;
            border-radius: 8px;
            font-size: 24px;
            text-align: center;
            z-index: 1000;
            pointer-events: none;
        }
        
        /* Custom fullscreen overlay */
        .video-container.fullscreen .text-overlay {
            font-size: 28px;
            padding: 20px 30px;
            bottom: 40px;
        }
        
        .controls {
            margin: 20px 0;
            text-align: center;
        }
        
        button {
            background: #007acc;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin: 0 10px;
        }
        
        button:hover {
            background: #005a9e;
        }
    </style>
</head>
<body>
    <div class="video-container">
        <h1>Plex MVP - Video Player</h1>
        
        <div class="controls">
            <button onclick="loadTestVideo()">Load Test Video</button>
            <button onclick="discoverPlexServers()">Discover Plex Servers</button>
            <button onclick="toggleOverlay()">Toggle Text Overlay</button>
            <button onclick="toggleCustomFullscreen()">Toggle Fullscreen</button>
            <button onclick="installPWA()" id="installButton" style="display: none;">Install App</button>
            <button onclick="testPWA()">Test PWA</button>
        </div>
        
        <div class="section">
            <h2>Plex Server Discovery</h2>
            <div id="serversList" class="list">
                <p>Click "Discover Plex Servers" to find your Plex server</p>
            </div>
        </div>
        
        <div class="section">
            <h2>PWA Status</h2>
            <div id="pwaStatus" class="list">
                <p>Loading PWA status...</p>
            </div>
        </div>
        
        <div style="position: relative;">
            <video id="videoPlayer" controls>
                Your browser does not support the video tag.
            </video>
            
            <div class="text-overlay" id="textOverlay">
                This is a test subtitle overlay
            </div>
        </div>
    </div>

    <script>
        const videoPlayer = document.getElementById('videoPlayer');
        const textOverlay = document.getElementById('textOverlay');
        const videoContainer = document.querySelector('.video-container');
        let overlayVisible = true;
        let isCustomFullscreen = false;
        
        function loadTestVideo() {
            // For now, we'll use a placeholder video
            // Later we'll replace this with a real DLNA URL
            videoPlayer.src = 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4';
            console.log('Loading test video...');
        }
        
        function toggleOverlay() {
            overlayVisible = !overlayVisible;
            textOverlay.style.display = overlayVisible ? 'block' : 'none';
            console.log('Overlay visibility:', overlayVisible);
        }
        
        // Custom fullscreen toggle
        function toggleCustomFullscreen() {
            isCustomFullscreen = !isCustomFullscreen;
            
            if (isCustomFullscreen) {
                videoContainer.classList.add('fullscreen');
                document.body.classList.add('fullscreen');
                // Hide other elements
                document.querySelector('.controls').style.display = 'none';
                document.querySelector('.section').style.display = 'none';
                document.querySelector('h1').style.display = 'none';
                console.log('Entered custom fullscreen mode');
            } else {
                videoContainer.classList.remove('fullscreen');
                document.body.classList.remove('fullscreen');
                // Show other elements
                document.querySelector('.controls').style.display = 'block';
                document.querySelector('.section').style.display = 'block';
                document.querySelector('h1').style.display = 'block';
                console.log('Exited custom fullscreen mode');
            }
        }
        
        // Keyboard shortcuts
        function setupKeyboardShortcuts() {
            document.addEventListener('keydown', function(event) {
                // F key to toggle fullscreen
                if (event.key === 'f' || event.key === 'F') {
                    event.preventDefault();
                    toggleCustomFullscreen();
                }
                
                // Escape key to exit fullscreen
                if (event.key === 'Escape' && isCustomFullscreen) {
                    event.preventDefault();
                    toggleCustomFullscreen();
                }
                
                // T key to toggle overlay
                if (event.key === 't' || event.key === 'T') {
                    event.preventDefault();
                    toggleOverlay();
                }
                
                // Space bar to play/pause video
                if (event.key === ' ') {
                    event.preventDefault();
                    if (videoPlayer.paused) {
                        videoPlayer.play();
                    } else {
                        videoPlayer.pause();
                    }
                }
            });
        }
        
        async function discoverPlexServers() {
            console.log('Discovering Plex servers...');
            
            try {
                const response = await fetch('/discover-dlna');
                const data = await response.json();
                
                if (data.success) {
                    displayServers(data.devices);
                } else {
                    console.error('Discovery failed:', data.error);
                    document.getElementById('serversList').innerHTML = '<p>Discovery failed: ' + data.error + '</p>';
                }
            } catch (error) {
                console.error('Error discovering servers:', error);
                document.getElementById('serversList').innerHTML = '<p>Error: ' + error.message + '</p>';
            }
        }
        
        function displayServers(servers) {
            const serversList = document.getElementById('serversList');
            
            if (servers.length === 0) {
                serversList.innerHTML = '<p>No Plex servers found. Make sure DLNA is enabled in Plex settings.</p>';
                return;
            }
            
            let html = '<h3>Found Plex Servers:</h3>';
            servers.forEach(server => {
                html += `
                    <div class="server-item">
                        <div><strong>IP:</strong> ${server.ip}</div>
                        <div><strong>Server:</strong> ${server.server || 'Unknown'}</div>
                        <button onclick="browseServer('${server.ip}')">Browse This Server</button>
                    </div>
                `;
            });
            
            serversList.innerHTML = html;
        }
        
        async function browseServer(serverIP) {
            console.log('Browsing server:', serverIP);
            
            try {
                const response = await fetch(`/browse-dlna/0?plexIP=${serverIP}&plexPort=32469`);
                const data = await response.json();
                
                if (data.success) {
                    displayContent(data.items, serverIP);
                } else {
                    console.error('Browse failed:', data.error);
                }
            } catch (error) {
                console.error('Error browsing server:', error);
            }
        }
        
        function displayContent(items, serverIP) {
            const serversList = document.getElementById('serversList');
            
            let html = `<h3>Content on ${serverIP}:</h3>`;
            
            if (items.length === 0) {
                html += '<p>No content found</p>';
            } else {
                items.forEach(item => {
                    if (item.type === 'file' && item.url) {
                        html += `
                            <div class="server-item">
                                <div><strong>${item.title}</strong></div>
                                <button onclick="loadDLNAVideo('${item.url}')">Play This Video</button>
                            </div>
                        `;
                    } else if (item.type === 'folder') {
                        html += `
                            <div class="server-item">
                                <div><strong>📁 ${item.title}</strong></div>
                                <button onclick="browseFolder('${item.id}', '${serverIP}')">Browse Folder</button>
                            </div>
                        `;
                    }
                });
            }
            
            serversList.innerHTML = html;
        }
        
        async function browseFolder(folderId, serverIP) {
            console.log('Browsing folder:', folderId, 'on server:', serverIP);
            
            try {
                const response = await fetch(`/browse-dlna/${folderId}?plexIP=${serverIP}&plexPort=32469`);
                const data = await response.json();
                
                if (data.success) {
                    displayContent(data.items, serverIP);
                } else {
                    console.error('Browse folder failed:', data.error);
                }
            } catch (error) {
                console.error('Error browsing folder:', error);
            }
        }
        
        function loadDLNAVideo(videoUrl) {
            console.log('Loading DLNA video:', videoUrl);
            videoPlayer.src = videoUrl;
            document.getElementById('videoTitle').textContent = 'DLNA Video';
        }
        
        // Initialize
        console.log('MVP Video Player loaded');
        setupKeyboardShortcuts();
        setupPWA();
        
        // Show keyboard shortcuts info
        console.log('Keyboard shortcuts:');
        console.log('- F: Toggle fullscreen');
        console.log('- Escape: Exit fullscreen');
        console.log('- T: Toggle text overlay');
        console.log('- Space: Play/pause video');
        
        // Note about extension errors
        console.log('⚠️ If you see "auth required" errors, they are from the Chrome extension running on this page');
        console.log('💡 To test PWA installation cleanly, consider disabling the Plex Metalayer extension temporarily');
        
        // PWA setup
        function setupPWA() {
            console.log('Setting up PWA...');
            console.log('Current URL:', window.location.href);
            console.log('Protocol:', window.location.protocol);
            
            if ('serviceWorker' in navigator) {
                // Try to register service worker, but don't fail if SSL certificate issues occur
                navigator.serviceWorker.register('/sw.js')
                    .then((registration) => {
                        console.log('Service Worker registered:', registration);
                        // Check if service worker is active
                        if (registration.active) {
                            console.log('✅ Service Worker is active');
                        } else {
                            console.log('⏳ Service Worker is installing...');
                        }
                    })
                    .catch((error) => {
                        console.log('Service Worker registration failed:', error);
                        console.log('⚠️ This is likely due to self-signed certificate. PWA may still work without service worker.');
                        
                        // Continue with PWA setup even if service worker fails
                        // Many PWAs work without service workers for basic installation
                    });
            } else {
                console.log('Service Worker not supported');
            }
            
            // Check if PWA can be installed
            let deferredPrompt;
            
            window.addEventListener('beforeinstallprompt', (e) => {
                console.log('🎉 PWA install prompt available!');
                e.preventDefault();
                deferredPrompt = e;
                window.deferredPrompt = deferredPrompt;
                
                // Show install button
                const installButton = document.getElementById('installButton');
                installButton.style.display = 'inline-block';
                console.log('Install button should now be visible');
                
                // Update PWA status to show install is available
                updatePWAStatus();
            });
            
            // Check if already installed
            window.addEventListener('appinstalled', (e) => {
                console.log('🎉 PWA was installed!');
                updatePWAStatus();
            });
            
            // Check if already installed
            if (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) {
                console.log('PWA is already installed and running in standalone mode');
            }
            
            // Debug PWA status
            console.log('PWA Status:');
            console.log('- Service Worker supported:', 'serviceWorker' in navigator);
            console.log('- HTTPS:', window.location.protocol === 'https:');
            console.log('- Manifest loaded:', !!document.querySelector('link[rel="manifest"]'));
            console.log('- Hostname:', window.location.hostname);
            
            // Additional PWA checks
            console.log('Additional PWA Checks:');
            console.log('- User Agent:', navigator.userAgent);
            console.log('- Platform:', navigator.platform);
            console.log('- Cookie Enabled:', navigator.cookieEnabled);
            console.log('- Online:', navigator.onLine);
            
            // Check if this is a mobile/tablet browser
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            console.log('- Mobile Device:', isMobile);
            
            // Update PWA status display
            updatePWAStatus();
            
            // Check if we're on localhost and suggest IP address
            if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                console.log('⚠️  Try accessing via IP address instead: http://192.168.7.76:3000');
                const pwaStatus = document.getElementById('pwaStatus');
                pwaStatus.innerHTML += '<p><strong>💡 Try this URL on your TV:</strong> http://192.168.7.76:3000</p>';
            }
        }
        
        function updatePWAStatus() {
            const pwaStatus = document.getElementById('pwaStatus');
            const status = {
                serviceWorker: 'serviceWorker' in navigator,
                https: window.location.protocol === 'https:',
                manifest: !!document.querySelector('link[rel="manifest"]'),
                standalone: window.matchMedia && window.matchMedia('(display-mode: standalone)').matches,
                installPrompt: !!window.deferredPrompt
            };
            
            let html = '<h3>PWA Requirements:</h3>';
            html += `<div>${status.serviceWorker ? '✅' : '⚠️'} Service Worker: ${status.serviceWorker ? 'Supported' : 'Not Required'}</div>`;
            html += `<div>${status.https ? '✅' : '❌'} HTTPS: ${status.https ? 'Yes' : 'No (required for PWA)'}</div>`;
            html += `<div>✅ Manifest: ${status.manifest ? 'Loaded' : 'Not Found'}</div>`;
            html += `<div>${status.standalone ? '✅' : '❌'} Standalone Mode: ${status.standalone ? 'Running' : 'Not Running'}</div>`;
            html += `<div>${status.installPrompt ? '🎉' : '❌'} Install Prompt: ${status.installPrompt ? 'Available' : 'Not Available'}</div>`;
            
            if (!status.https) {
                html += '<p><strong>⚠️ PWA Installation Issue:</strong></p>';
                html += '<p>PWA installation requires HTTPS, but you\'re accessing via HTTP.</p>';
                html += '<p><strong>Solutions:</strong></p>';
                html += '<ul>';
                html += '<li><strong>🎯 Try HTTPS:</strong> <a href="https://192.168.7.76:3443" target="_blank">https://192.168.7.76:3443</a></li>';
                html += '<li>Use the custom fullscreen mode (F key) instead</li>';
                html += '<li>Focus on the video player functionality for now</li>';
                html += '</ul>';
                html += '<p><strong>Current URL:</strong> ' + window.location.href + '</p>';
            } else {
                html += '<p><strong>🎉 HTTPS detected! PWA installation should be available.</strong></p>';
            }
            
            pwaStatus.innerHTML = html;
        }
        
        // Manual PWA install
        function installPWA() {
            if (window.deferredPrompt) {
                window.deferredPrompt.prompt();
                window.deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        console.log('PWA installed successfully');
                    } else {
                        console.log('PWA installation declined');
                    }
                    window.deferredPrompt = null;
                    document.getElementById('installButton').style.display = 'none';
                });
            } else {
                console.log('No install prompt available');
                // Try alternative installation method
                if (navigator.standalone !== undefined) {
                    console.log('iOS standalone mode available');
                }
            }
        }
        
        // Test PWA functionality
        function testPWA() {
            console.log('=== PWA Test Results ===');
            console.log('URL:', window.location.href);
            console.log('Protocol:', window.location.protocol);
            console.log('Hostname:', window.location.hostname);
            console.log('Service Worker:', 'serviceWorker' in navigator);
            console.log('Manifest:', !!document.querySelector('link[rel="manifest"]'));
            console.log('Deferred Prompt:', !!window.deferredPrompt);
            console.log('Standalone Mode:', window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
            
            // Try to trigger install prompt manually
            if (window.deferredPrompt) {
                console.log('✅ Install prompt is available!');
                document.getElementById('installButton').style.display = 'inline-block';
            } else {
                console.log('❌ No install prompt available');
                console.log('💡 Try refreshing the page or waiting a moment');
                
                // Try to manually trigger the install prompt
                console.log('🔍 Checking if PWA meets all criteria...');
                const criteria = {
                    hasManifest: !!document.querySelector('link[rel="manifest"]'),
                    hasServiceWorker: 'serviceWorker' in navigator, // Not strictly required
                    isHTTPS: window.location.protocol === 'https:',
                    notAlreadyInstalled: !window.matchMedia('(display-mode: standalone)').matches,
                    hasValidIcon: true, // We have an icon
                    hasValidName: true, // We have a name
                    hasValidStartUrl: true, // We have a start URL
                    isEngaged: true // Assume user is engaged if they clicked test
                };
                
                console.log('PWA Criteria:', criteria);
                
                if (Object.values(criteria).every(Boolean)) {
                    console.log('✅ All criteria met - install prompt should appear soon');
                    console.log('💡 Try interacting with the page (click buttons, scroll)');
                    console.log('💡 Some browsers require user engagement before showing install prompt');
                } else {
                    console.log('❌ Some criteria not met:', criteria);
                }
                
                // Check for common issues
                console.log('🔍 Common PWA Issues:');
                console.log('- Manifest accessible:', fetch('/manifest.json').then(r => r.ok).catch(() => false));
                console.log('- Service Worker accessible:', fetch('/sw.js').then(r => r.ok).catch(() => false));
                console.log('- Page is responsive:', window.innerWidth > 0);
                console.log('- Page has been visited before:', !window.matchMedia('(display-mode: standalone)').matches);
            }
            
            // Update status display
            updatePWAStatus();
        }
    </script>
</body>
</html>
