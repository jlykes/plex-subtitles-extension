<!DOCTYPE html>
<html>
<head>
    <title>Plex Browser</title>
    <meta charset="utf-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #000;
            color: #fff;
            margin: 0;
            padding: 20px;
            font-size: 18px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .section {
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }
        
        .item {
            background: #333;
            padding: 10px;
            margin: 5px 0;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .item:hover {
            background: #555;
        }
        
        .item.selected {
            background: #007acc;
        }
        
        .controls {
            display: flex;
            gap: 15px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        
        .control-btn {
            background: #333;
            color: #fff;
            border: 2px solid #666;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .control-btn:hover {
            background: #555;
            border-color: #888;
        }
        
        .info {
            background: rgba(0,255,0,0.1);
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>DLNA Media Browser</h1>
        
        <div class="server-section" style="background: rgba(0,0,0,0.8); padding: 15px; border-radius: 8px; margin: 20px 0;">
            <h3>DLNA Server Settings</h3>
            <p>Connect to your Plex server via DLNA (no authentication required)</p>
            <div style="display: flex; gap: 10px; align-items: center; margin: 10px 0;">
                <input type="text" id="plexIP" placeholder="Plex IP (e.g., 192.168.4.113)" style="flex: 1; padding: 8px; border-radius: 4px; border: 1px solid #666; background: #333; color: #fff;" value="192.168.4.113">
                <input type="text" id="plexPort" placeholder="Port (e.g., 32469)" style="width: 120px; padding: 8px; border-radius: 4px; border: 1px solid #666; background: #333; color: #fff;" value="32469">
                <button class="control-btn" onclick="discoverServers()">Discover Servers</button>
            </div>
            <p style="font-size: 14px; color: #888;">
                DLNA discovery will automatically find Plex servers on your network
            </p>
        </div>
        
        <div class="controls">
            <button class="control-btn" onclick="browseRoot()">Browse Root</button>
            <button class="control-btn" onclick="browseSelected()">Browse Selected</button>
            <button class="control-btn" onclick="playSelectedVideo()">Play Selected Video</button>
            <button class="control-btn" onclick="goToVideoPlayer()">Go to Video Player</button>
        </div>
        
        <div id="sections" class="section">
            <h3>DLNA Folders</h3>
            <div id="sectionsList">Click "Browse Root" to start browsing</div>
        </div>
        
        <div id="items" class="section">
            <h3>Media Items</h3>
            <div id="itemsList">Select a folder first</div>
        </div>
        
        <div id="info" class="info" style="display: none;">
            <h4>Selected Video Info:</h4>
            <div id="videoInfo"></div>
        </div>
    </div>

    <script>
        let sections = [];
        let items = [];
        let selectedSection = null;
        let selectedVideo = null;
        let currentObjectId = '0';
        
        // Load settings from localStorage on page load
        window.addEventListener('load', () => {
            const savedIP = localStorage.getItem('plexIP');
            const savedPort = localStorage.getItem('plexPort');
            if (savedIP) document.getElementById('plexIP').value = savedIP;
            if (savedPort) document.getElementById('plexPort').value = savedPort;
        });
        
        function saveSettings() {
            const plexIP = document.getElementById('plexIP').value.trim();
            const plexPort = document.getElementById('plexPort').value.trim();
            localStorage.setItem('plexIP', plexIP);
            localStorage.setItem('plexPort', plexPort);
        }
        
        async function discoverServers() {
            try {
                saveSettings();
                const response = await fetch('/discover-dlna');
                const data = await response.json();
                
                if (data.success) {
                    if (data.devices.length > 0) {
                        alert(`Found ${data.devices.length} Plex server(s) on your network!`);
                        console.log('Discovered devices:', data.devices);
                    } else {
                        alert('No Plex servers found. Make sure DLNA is enabled in Plex settings.');
                    }
                } else {
                    alert('Discovery failed: ' + data.error);
                }
            } catch (error) {
                console.error('Error discovering servers:', error);
                alert('Error discovering servers: ' + error.message);
            }
        }
        
        async function browseRoot() {
            try {
                saveSettings();
                const plexIP = document.getElementById('plexIP').value.trim();
                const plexPort = document.getElementById('plexPort').value.trim();
                
                const response = await fetch(`/browse-dlna?plexIP=${plexIP}&plexPort=${plexPort}`);
                const data = await response.json();
                
                if (data.success) {
                    sections = data.items.filter(item => item.isFolder);
                    items = data.items.filter(item => !item.isFolder);
                    currentObjectId = '0';
                    displaySections();
                    displayItems();
                } else {
                    alert('Failed to browse root: ' + data.error);
                }
            } catch (error) {
                console.error('Error browsing root:', error);
                alert('Error browsing root: ' + error.message);
            }
        }
        
        function displaySections() {
            const sectionsList = document.getElementById('sectionsList');
            sectionsList.innerHTML = '';
            
            sections.forEach(section => {
                const div = document.createElement('div');
                div.className = 'item';
                div.textContent = section.title;
                div.onclick = () => selectSection(section);
                sectionsList.appendChild(div);
            });
        }
        
        function selectSection(section) {
            selectedSection = section;
            
            // Update visual selection
            document.querySelectorAll('#sectionsList .item').forEach(item => {
                item.classList.remove('selected');
            });
            event.target.classList.add('selected');
            
            console.log('Selected section:', section);
        }
        
        async function browseSelected() {
            if (!selectedSection) {
                alert('Please select a folder first');
                return;
            }
            
            try {
                saveSettings();
                const plexIP = document.getElementById('plexIP').value.trim();
                const plexPort = document.getElementById('plexPort').value.trim();
                
                const response = await fetch(`/browse-dlna/${selectedSection.id}?plexIP=${plexIP}&plexPort=${plexPort}`);
                const data = await response.json();
                
                if (data.success) {
                    sections = data.items.filter(item => item.isFolder);
                    items = data.items.filter(item => !item.isFolder);
                    currentObjectId = selectedSection.id;
                    displaySections();
                    displayItems();
                } else {
                    alert('Failed to browse folder: ' + data.error);
                }
            } catch (error) {
                console.error('Error browsing folder:', error);
                alert('Error browsing folder: ' + error.message);
            }
        }
        
        function displayItems() {
            const itemsList = document.getElementById('itemsList');
            itemsList.innerHTML = '';
            
            items.forEach(item => {
                const div = document.createElement('div');
                div.className = 'item';
                div.textContent = item.title;
                div.onclick = () => selectVideo(item);
                itemsList.appendChild(div);
            });
        }
        
        function selectVideo(video) {
            selectedVideo = video;
            
            // Update visual selection
            document.querySelectorAll('#itemsList .item').forEach(item => {
                item.classList.remove('selected');
            });
            event.target.classList.add('selected');
            
            // Show video info
            const info = document.getElementById('info');
            const videoInfo = document.getElementById('videoInfo');
            videoInfo.innerHTML = `
                <div><strong>Title:</strong> ${video.title}</div>
                <div><strong>ID:</strong> ${video.id}</div>
                <div><strong>URL:</strong> ${video.url || 'No direct URL'}</div>
            `;
            info.style.display = 'block';
            
            console.log('Selected video:', video);
        }
        
        async function playSelectedVideo() {
            if (!selectedVideo) {
                alert('Please select a video first');
                return;
            }
            
            if (!selectedVideo.url) {
                alert('This video has no direct streaming URL');
                return;
            }
            
            // Store selected video in localStorage for the video player
            localStorage.setItem('selectedVideo', JSON.stringify(selectedVideo));
            window.location.href = '/video-player';
        }
        
        function goToVideoPlayer() {
            if (!selectedVideo) {
                alert('Please select a video first');
                return;
            }
            
            // Store selected video in localStorage for the video player
            localStorage.setItem('selectedVideo', JSON.stringify(selectedVideo));
            window.location.href = '/video-player';
        }
    </script>
</body>
</html>
